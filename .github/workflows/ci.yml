name: ci

# Automatic CI is paused to conserve GitHub Actions minutes. Run it from the
# Actions tab (or `gh workflow run ci`) when a manual check is wanted.
# Restore automatic runs by replacing the trigger below with:
#   on: [push, pull_request]
on:
  workflow_dispatch:

permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
      - run: go test ./...
        working-directory: backend
      - run: go vet ./...
        working-directory: backend
      - run: GOOS=windows GOARCH=amd64 go build -o /tmp/workspace-picker.exe .
        working-directory: backend
      - run: GOOS=darwin GOARCH=arm64 go build -o /tmp/workspace-picker-darwin .
        working-directory: backend
