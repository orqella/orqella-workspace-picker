<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Workspace picker</title>
  <link rel="stylesheet" href="/assets/theme.css">
  <link rel="stylesheet" href="/assets/module.css">
  <link rel="stylesheet" href="overview.css">
</head>
<body>
  <main class="workspace-card">
    <header class="workspace-head">
      <div class="workspace-heading">
        <p class="eyebrow">Workspaces</p>
        <h1 id="machineLabel">This machine</h1>
      </div>
      <button class="icon-button workspace-refresh" id="refresh" type="button" title="Refresh workspaces" aria-label="Refresh workspaces">↻</button>
    </header>
    <div class="workspace-list" id="workspaceList" aria-live="polite" aria-busy="true">
      <div class="workspace-empty">Loading workspaces…</div>
    </div>
    <footer class="workspace-foot">
      <span id="backendLabel">Checking desktop…</span>
      <span id="workspaceStatus">connecting</span>
    </footer>
  </main>
  <script src="overview.js"></script>
</body>
</html>
